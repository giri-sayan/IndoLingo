<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tigerHeadGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFA033" />
      <stop offset="45%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="snoutGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF3D6" />
    </linearGradient>
    <linearGradient id="earPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB3BA" />
      <stop offset="100%" stop-color="#FF6B8B" />
    </linearGradient>
    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="badgeBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2E38" />
      <stop offset="100%" stop-color="#131F24" />
    </linearGradient>
  </defs>

  <!-- Squircle Badge -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#badgeBgGrad)" stroke="url(#badgeBorderGrad)" stroke-width="3.5" />

  <!-- Ears -->
  <g>
    <ellipse cx="26" cy="24" rx="13" ry="12" transform="rotate(-20 26 24)" fill="url(#tigerHeadGrad)" />
    <path d="M 15 22 C 18 13, 31 12, 38 19 C 33 17, 20 17, 15 22 Z" fill="#1E293B" />
    <circle cx="23" cy="18" r="2.5" fill="#FFFFFF" />
    <ellipse cx="28" cy="26" rx="7.5" ry="6.5" transform="rotate(-20 28 26)" fill="url(#earPinkGrad)" />
  </g>
  <g>
    <ellipse cx="74" cy="24" rx="13" ry="12" transform="rotate(20 74 24)" fill="url(#tigerHeadGrad)" />
    <path d="M 85 22 C 82 13, 69 12, 62 19 C 67 17, 80 17, 85 22 Z" fill="#1E293B" />
    <circle cx="77" cy="18" r="2.5" fill="#FFFFFF" />
    <ellipse cx="72" cy="26" rx="7.5" ry="6.5" transform="rotate(20 72 26)" fill="url(#earPinkGrad)" />
  </g>

  <!-- Head Base -->
  <ellipse cx="50" cy="52" rx="31" ry="26" fill="url(#tigerHeadGrad)" />
  <ellipse cx="50" cy="42" rx="28" ry="20" fill="url(#tigerHeadGrad)" />

  <!-- Bengal Tiger Forehead Stripes -->
  <path d="M 48.5 26 L 51.5 26 L 51 34 L 49 34 Z" fill="#1E293B" />
  <path d="M 42 30 Q 50 32 58 30 Q 50 33 42 30 Z" fill="#1E293B" />
  <path d="M 37 34 Q 50 38 63 34 Q 50 36 37 34 Z" fill="#1E293B" />
  <path d="M 31 39 Q 37 41 39 45 Q 35 43 31 40 Z" fill="#1E293B" />
  <path d="M 69 39 Q 63 41 61 45 Q 65 43 69 40 Z" fill="#1E293B" />

  <!-- Auspicious Tilak -->
  <ellipse cx="50" cy="40" rx="2.4" ry="3.8" fill="#DC2626" />
  <circle cx="50" cy="44.5" r="1.3" fill="#FBBF24" />

  <!-- Eyes -->
  <ellipse cx="37" cy="50" rx="6.5" ry="7.5" fill="#1E293B" />
  <ellipse cx="37" cy="51" rx="5" ry="6" fill="#D97706" />
  <ellipse cx="37" cy="51.5" rx="3.8" ry="4.5" fill="#0F172A" />
  <circle cx="34.8" cy="48" r="2.4" fill="#FFFFFF" />
  <circle cx="39.2" cy="53" r="1.2" fill="#FFFFFF" />
  <path d="M 31 42.5 Q 37 39.5 43 42" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" />

  <ellipse cx="63" cy="50" rx="6.5" ry="7.5" fill="#1E293B" />
  <ellipse cx="63" cy="51" rx="5" ry="6" fill="#D97706" />
  <ellipse cx="63" cy="51.5" rx="3.8" ry="4.5" fill="#0F172A" />
  <circle cx="60.8" cy="48" r="2.4" fill="#FFFFFF" />
  <circle cx="65.2" cy="53" r="1.2" fill="#FFFFFF" />
  <path d="M 57 42 Q 63 39.5 69 42.5" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <ellipse cx="30" cy="58" rx="5" ry="3.5" fill="#FDA4AF" opacity="0.75" />
  <ellipse cx="70" cy="58" rx="5" ry="3.5" fill="#FDA4AF" opacity="0.75" />

  <!-- Snout -->
  <ellipse cx="44.5" cy="62" rx="8.5" ry="7" fill="url(#snoutGrad)" />
  <ellipse cx="55.5" cy="62" rx="8.5" ry="7" fill="url(#snoutGrad)" />
  <path d="M 45 55 Q 50 56.5 55 55 L 56 61 L 44 61 Z" fill="url(#snoutGrad)" />

  <circle cx="41" cy="61" r="0.9" fill="#94A3B8" />
  <circle cx="39" cy="63" r="0.9" fill="#94A3B8" />
  <circle cx="42" cy="64.5" r="0.9" fill="#94A3B8" />
  <circle cx="59" cy="61" r="0.9" fill="#94A3B8" />
  <circle cx="61" cy="63" r="0.9" fill="#94A3B8" />
  <circle cx="58" cy="64.5" r="0.9" fill="#94A3B8" />

  <!-- Whiskers (Saffron, White, Green) -->
  <path d="M 36 58 Q 25 55 16 53" stroke="#FF7A00" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 35 62 Q 23 62 14 62" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 36 66 Q 25 69 17 71" stroke="#16A34A" stroke-width="2" stroke-linecap="round" fill="none" />

  <path d="M 64 58 Q 75 55 84 53" stroke="#FF7A00" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 65 62 Q 77 62 86 62" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 64 66 Q 75 69 83 71" stroke="#16A34A" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Nose & Smile -->
  <path d="M 46.5 56.5 Q 50 54.5 53.5 56.5 Q 52 61.5 50 61.5 Q 48 61.5 46.5 56.5 Z" fill="#E11D48" />
  <circle cx="48.8" cy="57.2" r="0.8" fill="white" opacity="0.9" />
  <path d="M 50 61.5 L 50 63.5" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 44.5 63.5 Q 47.5 66.5 50 64 Q 52.5 66.5 55.5 63.5" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" fill="none" />
